name: Cabin Windows native verification
on:
  push:
    branches: ['windows-native/cabin-acoustics']
    paths: ['cabin-acoustics/**', '.github/workflows/cabin-native.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cabin-acoustics
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core, shared MVVM and actual WPF window checks
        run: ./tools/verify-windows.ps1
      - name: Publish offline self contained Windows folder
        if: success()
        run: ./tools/publish-windows.ps1
      - name: Launch published native executable directly
        if: success()
        run: ./tools/smoke-published.ps1
      - name: Retain actual evidence and runnable Windows package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabin-windows-native
          path: |
            cabin-acoustics/docs/screenshots
            cabin-acoustics/docs/test-windows.json
            cabin-acoustics/artifacts/win-x64
      - name: Preserve verified native captures on this software branch
        if: success() && github.ref == 'refs/heads/windows-native/cabin-acoustics'
        run: |
          git config user.name 'Cabin Windows verification'
          git config user.email 'codex@openai.com'
          git add docs/screenshots docs/test-windows.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Record actual Windows WPF verification and native captures [skip ci]'
            git push origin HEAD:windows-native/cabin-acoustics
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve verified captures on the independent branch' }
          }
