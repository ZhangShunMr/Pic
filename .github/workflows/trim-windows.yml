name: Trim contact Windows native verification
on:
  push:
    branches: ['windows-native/trim-contact-design-20261104']
    paths:
      - 'trim-contact-design/src/**'
      - 'trim-contact-design/tests/**'
      - 'trim-contact-design/TrimContact.sln'
      - 'trim-contact-design/Directory.Build.props'
      - 'trim-contact-design/global.json'
      - 'trim-contact-design/tools/verify-windows.ps1'
      - 'trim-contact-design/tools/smoke-published.ps1'
      - 'trim-contact-design/tools/capture-windows.ps1'
      - 'trim-contact-design/tools/check-word.ps1'
      - 'trim-contact-design/tools/build_materials.py'
      - 'trim-contact-design/tools/manual_content.py'
      - 'trim-contact-design/tools/source_inventory.py'
      - 'trim-contact-design/tools/package_release.py'
      - '.github/workflows/trim-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: trim-contact-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Build and actual production WPF window checks
        run: ./tools/verify-windows.ps1
      - name: Publish and launch self-contained executable
        if: success()
        run: ./tools/smoke-published.ps1
      - name: Check actual Microsoft Word availability
        if: always()
        run: ./tools/check-word.ps1
      - name: Build illustrated materials and package the tested executable
        if: success()
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/build_materials.py
          python tools/package_release.py
      - name: Retain actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trim-windows-native
          path: |
            trim-contact-design/docs/windows
            trim-contact-design/artifacts/win-x64
      - name: Preserve evidence on the existing independent branch
        if: always() && github.ref == 'refs/heads/windows-native/trim-contact-design-20261104'
        run: |
          git config user.name 'Trim Windows verification'
          git config user.email 'codex@openai.com'
          git add docs/windows docs/materials-check.json docs/screenshot-inventory.json docs/source-inventory.json docs/源码清单.md docs/完整生产源码清单.txt docs/完整生产源码打印稿.docx docs/操作说明书-待Windows核验.docx docs/操作说明书.md docs/软著信息采集表-草稿.docx docs/软著信息采集表.md dist
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Record actual Windows verification evidence [skip ci]'
            git pull --rebase origin windows-native/trim-contact-design-20261104
            git push origin HEAD:windows-native/trim-contact-design-20261104
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve evidence on the independent branch' }
          }
